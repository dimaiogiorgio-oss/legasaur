<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legasaur — Database Fantacalcio</title>
<style>
:root {
  --bg: #0f1923;
  --bg2: #182633;
  --bg3: #1e3044;
  --accent: #00e676;
  --accent2: #00bfa5;
  --gold: #ffd700;
  --silver: #c0c0c0;
  --bronze: #cd7f32;
  --text: #e0e6ed;
  --text2: #8899aa;
  --danger: #ff5252;
  --border: #2a3f52;
  --radius: 10px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
/* Header */
.hero {
  background: linear-gradient(135deg, #0d253f 0%, #1a4a2e 50%, #0d253f 100%);
  padding: 3rem 1rem 2rem;
  text-align: center;
  border-bottom: 3px solid var(--accent);
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: radial-gradient(circle at 30% 50%, rgba(0,230,118,0.08) 0%, transparent 50%),
              radial-gradient(circle at 70% 50%, rgba(0,191,165,0.08) 0%, transparent 50%);
}
.hero h1 {
  font-size: 2.8rem;
  font-weight: 800;
  letter-spacing: 4px;
  background: linear-gradient(90deg, var(--accent), var(--gold), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  position: relative;
}
.hero p {
  color: var(--text2);
  font-size: 1rem;
  margin-top: .5rem;
  position: relative;
}
/* Nav */
nav {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
  overflow-x: auto;
  white-space: nowrap;
  -webkit-overflow-scrolling: touch;
}
nav .nav-inner {
  display: flex;
  gap: 0;
  max-width: 1100px;
  margin: 0 auto;
}
nav button {
  background: none;
  border: none;
  color: var(--text2);
  padding: .9rem 1.2rem;
  font-size: .88rem;
  font-weight: 600;
  cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: all .2s;
  white-space: nowrap;
}
nav button:hover { color: var(--text); }
nav button.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}
/* Main */
main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 1.5rem 1rem 4rem;
}
.section { display: none; }
.section.active { display: block; }
.section-title {
  font-size: 1.5rem;
  font-weight: 700;
  margin-bottom: 1.2rem;
  display: flex;
  align-items: center;
  gap: .6rem;
}
.section-title .icon { font-size: 1.3rem; }
/* Season selector */
.season-selector {
  display: flex;
  flex-wrap: wrap;
  gap: .4rem;
  margin-bottom: 1.5rem;
}
.season-btn {
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text2);
  padding: .45rem .9rem;
  border-radius: 20px;
  font-size: .82rem;
  cursor: pointer;
  transition: all .2s;
}
.season-btn:hover { border-color: var(--accent); color: var(--text); }
.season-btn.active {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
  font-weight: 700;
}
/* Tables */
table {
  width: 100%;
  border-collapse: collapse;
  background: var(--bg2);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 1.5rem;
}
th {
  background: var(--bg3);
  padding: .7rem .6rem;
  text-align: left;
  font-size: .78rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text2);
  border-bottom: 2px solid var(--border);
}
td {
  padding: .6rem;
  border-bottom: 1px solid var(--border);
  font-size: .88rem;
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(0,230,118,0.04); }
.pos-cell {
  font-weight: 800;
  width: 2.5rem;
  text-align: center;
}
.pos-1 { color: var(--gold); }
.pos-2 { color: var(--silver); }
.pos-3 { color: var(--bronze); }
.team-cell {
  font-weight: 600;
  min-width: 150px;
}
.num-cell { text-align: center; font-variant-numeric: tabular-nums; }
.verdict-cell {
  font-size: .78rem;
  color: var(--accent);
  font-weight: 600;
  max-width: 200px;
}
.verdict-retro { color: var(--danger); }
/* Cards */
.trophy-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 1rem;
  margin-bottom: 1.5rem;
}
.trophy-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.2rem;
  transition: transform .2s, border-color .2s;
}
.trophy-card:hover {
  transform: translateY(-2px);
  border-color: var(--accent);
}
.trophy-card .season {
  font-size: .82rem;
  color: var(--text2);
  margin-bottom: .6rem;
  font-weight: 600;
}
.trophy-card .winner {
  font-size: 1.1rem;
  font-weight: 700;
  margin-bottom: .3rem;
  display: flex;
  align-items: center;
  gap: .4rem;
}
.trophy-line {
  font-size: .82rem;
  color: var(--text2);
  padding: .2rem 0;
  display: flex;
  gap: .5rem;
}
.trophy-line .label { color: var(--text2); min-width: 120px; }
.trophy-line .val { color: var(--text); font-weight: 600; }
/* Storico bar */
.storico-bar {
  display: flex;
  align-items: center;
  gap: .8rem;
  padding: .6rem 0;
  border-bottom: 1px solid var(--border);
}
.storico-bar:last-child { border-bottom: none; }
.storico-team { width: 180px; font-weight: 600; font-size: .88rem; }
.storico-visual {
  flex: 1;
  display: flex;
  gap: 2px;
  height: 26px;
  align-items: center;
}
.storico-segment {
  height: 100%;
  border-radius: 3px;
  min-width: 0;
  transition: width .5s ease;
}
.storico-total {
  font-weight: 800;
  font-size: 1rem;
  min-width: 2rem;
  text-align: right;
}
/* Rose */
.roster-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 1rem;
}
.roster-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.roster-header {
  background: linear-gradient(135deg, var(--bg3), #1a3a2a);
  padding: .8rem 1rem;
  font-weight: 700;
  font-size: 1rem;
  border-bottom: 2px solid var(--accent);
}
.roster-table { width: 100%; }
.roster-table td { padding: .35rem .5rem; font-size: .82rem; }
.roster-table .role-badge {
  display: inline-block;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  text-align: center;
  line-height: 22px;
  font-size: .7rem;
  font-weight: 800;
  color: #fff;
}
.role-P { background: #f57c00; }
.role-D { background: #1976d2; }
.role-C { background: #388e3c; }
.role-A { background: #d32f2f; }
.roster-table .player-name { font-weight: 600; }
.roster-table .cost { color: var(--gold); font-weight: 700; text-align: right; }
/* Stats overview */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 1rem;
  margin-bottom: 2rem;
}
.stat-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.2rem;
  text-align: center;
}
.stat-card .stat-val {
  font-size: 2rem;
  font-weight: 800;
  color: var(--accent);
}
.stat-card .stat-label {
  font-size: .82rem;
  color: var(--text2);
  margin-top: .3rem;
}
/* Responsive */
@media (max-width: 600px) {
  .hero h1 { font-size: 1.8rem; letter-spacing: 2px; }
  nav button { padding: .7rem .8rem; font-size: .8rem; }
  .trophy-grid { grid-template-columns: 1fr; }
  .roster-grid { grid-template-columns: 1fr; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  table { font-size: .8rem; }
  th, td { padding: .4rem .3rem; }
  .storico-team { width: 110px; font-size: .78rem; }
}
/* Team selector for rose */
.team-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: .3rem;
  margin-bottom: 1rem;
}
.team-tab {
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text2);
  padding: .4rem .7rem;
  border-radius: 6px;
  font-size: .78rem;
  cursor: pointer;
  transition: all .2s;
}
.team-tab:hover { border-color: var(--accent); }
.team-tab.active {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
  font-weight: 700;
}
.search-box {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: .6rem 1rem;
  color: var(--text);
  font-size: .88rem;
  width: 100%;
  max-width: 350px;
  margin-bottom: 1rem;
  outline: none;
}
.search-box:focus { border-color: var(--accent); }
.hidden { display: none !important; }
</style>
</head>

</main>

// ---- NAV ----
function showSection(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('sec-' + id).classList.add('active');
  event.target.classList.add('active');
}

// ---- CLASSIFICHE ----
let currentClsSeason = '2025/2026';

function renderClassifica(season) {
  currentClsSeason = season;
  const teams = DATA.classifiche[season] || [];
  document.querySelectorAll('#cls-seasons .season-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.season === season);
  });
  
  // Detect available columns
  const hasG = teams.some(t => t.g !== undefined);
  const hasV = teams.some(t => t.v !== undefined);
  const hasPt = teams.some(t => t.pt !== undefined);
  const hasTotale = teams.some(t => t.totale !== undefined || t.pt_totali !== undefined);
  const hasVerdict = teams.some(t => t.verdict);
  
  let cols = '<th>#</th><th>Squadra</th>';
  if (hasPt) cols += '<th class="num-cell">Pt</th>';
  if (hasG) cols += '<th class="num-cell">G</th>';
  if (hasV) cols += '<th class="num-cell">V</th><th class="num-cell">N</th><th class="num-cell">P</th>';
  if (teams.some(t => t.gf !== undefined)) cols += '<th class="num-cell">Gf</th><th class="num-cell">Gs</th><th class="num-cell">Dr</th>';
  if (hasTotale) cols += '<th class="num-cell">Pt. Tot.</th>';
  if (hasVerdict) cols += '<th>Verdetti</th>';
  
  let rows = '';
  teams.forEach(t => {
    const posClass = t.pos <= 3 ? ' pos-' + t.pos : '';
    let vClass = '';
    let verdict = t.verdict || '';
    if (verdict.includes('Ultimo')) vClass = ' verdict-retro';
    
    rows += '<tr>';
    rows += `<td class="pos-cell${posClass}">${t.pos}</td>`;
    rows += `<td class="team-cell">${t.team}</td>`;
    if (hasPt) rows += `<td class="num-cell"><b>${t.pt !== undefined ? Math.round(t.pt) : '-'}</b></td>`;
    if (hasG) rows += `<td class="num-cell">${t.g !== undefined ? Math.round(t.g) : '-'}</td>`;
    if (hasV) {
      rows += `<td class="num-cell">${t.v !== undefined ? Math.round(t.v) : '-'}</td>`;
      rows += `<td class="num-cell">${t.n !== undefined ? Math.round(t.n) : '-'}</td>`;
      rows += `<td class="num-cell">${t.p !== undefined ? Math.round(t.p) : '-'}</td>`;
    }
    if (teams.some(t => t.gf !== undefined)) {
      rows += `<td class="num-cell">${t.gf !== undefined ? Math.round(t.gf) : '-'}</td>`;
      rows += `<td class="num-cell">${t.gs !== undefined ? Math.round(t.gs) : '-'}</td>`;
      rows += `<td class="num-cell">${t.dr !== undefined ? t.dr : '-'}</td>`;
    }
    if (hasTotale) {
      const tot = t.totale || t.pt_totali || '-';
      rows += `<td class="num-cell">${tot !== '-' ? tot.toFixed(1) : '-'}</td>`;
    }
    if (hasVerdict) rows += `<td class="verdict-cell${vClass}">${verdict}</td>`;
    rows += '</tr>';
  });
  
  document.getElementById('cls-table').innerHTML = `<table><thead><tr>${cols}</tr></thead><tbody>${rows}</tbody></table>`;
}

function initClassifiche() {
  const seasons = Object.keys(DATA.classifiche).reverse();
  const container = document.getElementById('cls-seasons');
  container.innerHTML = seasons.map(s => 
    `<button class="season-btn${s === currentClsSeason ? ' active' : ''}" data-season="${s}" onclick="renderClassifica('${s}')">${s}</button>`
  ).join('');
  renderClassifica(currentClsSeason);
}

// ---- ALBO D'ORO ----
function initAlbo() {
  const grid = document.getElementById('albo-grid');
  grid.innerHTML = DATA.albo.slice().reverse().map(a => {
    let lines = '';
    lines += `<div class="trophy-line"><span class="label">&#127942; Legasaur:</span><span class="val">${a.legasaur || '-'}</span></div>`;
    const coffaLabel = a.stagione >= '2021' ? 'Coffa dei Capponi' : (a.stagione >= '2018' ? 'Coffa Italia' : 'Coffa Italia');
    lines += `<div class="trophy-line"><span class="label">&#127942; ${coffaLabel}:</span><span class="val">${a.coffa && a.coffa !== '//' ? a.coffa : '-'}</span></div>`;
    const europaLabel = a.stagione >= '2021' ? '+Europa League' : 'Cof FA Cup';
    lines += `<div class="trophy-line"><span class="label">&#127942; ${europaLabel}:</span><span class="val">${a.europa && a.europa !== '//' ? a.europa : '-'}</span></div>`;
    lines += `<div class="trophy-line"><span class="label">&#127942; Supercoffa:</span><span class="val">${a.supercoffa && a.supercoffa !== '//' ? a.supercoffa : '-'}</span></div>`;
    if (a.retrocessione && a.retrocessione !== '//') {
      lines += `<div class="trophy-line"><span class="label" style="color:var(--danger)">&#128308; Retrocessa:</span><span class="val" style="color:var(--danger)">${a.retrocessione}</span></div>`;
    }
    return `<div class="trophy-card">
      <div class="season">${a.stagione}</div>
      <div class="winner">&#127942; ${a.legasaur}</div>
      ${lines}
    </div>`;
  }).join('');
}

// ---- STORICO TROFEI ----
function initStorico() {
  const container = document.getElementById('storico-content');
  const maxTot = Math.max(...DATA.storico.map(s => s.totale));
  
  // Also render as table
  let tableHtml = `<table><thead><tr>
    <th>Squadra</th><th class="num-cell">Legasaur</th><th class="num-cell">Coffa</th>
    <th class="num-cell">+Europa</th><th class="num-cell">Supercoffa</th><th class="num-cell">Totale</th>
  </tr></thead><tbody>`;
  
  let barsHtml = '';
  DATA.storico.forEach(s => {
    if (s.totale === 0 && s.legasaur === 0) return;
    const w = maxTot > 0 ? (s.totale / maxTot * 100) : 0;
    const lW = s.legasaur / (maxTot || 1) * 100;
    const cW = s.coffa / (maxTot || 1) * 100;
    const eW = s.europa / (maxTot || 1) * 100;
    const scW = s.supercoffa / (maxTot || 1) * 100;
    
    barsHtml += `<div class="storico-bar">
      <div class="storico-team">${s.team}</div>
      <div class="storico-visual">
        ${s.legasaur > 0 ? `<div class="storico-segment" style="width:${lW}%;background:var(--gold)" title="Legasaur: ${s.legasaur}"></div>` : ''}
        ${s.coffa > 0 ? `<div class="storico-segment" style="width:${cW}%;background:var(--accent)" title="Coffa: ${s.coffa}"></div>` : ''}
        ${s.europa > 0 ? `<div class="storico-segment" style="width:${eW}%;background:#42a5f5" title="+Europa: ${s.europa}"></div>` : ''}
        ${s.supercoffa > 0 ? `<div class="storico-segment" style="width:${scW}%;background:#ab47bc" title="Supercoffa: ${s.supercoffa}"></div>` : ''}
      </div>
      <div class="storico-total">${s.totale}</div>
    </div>`;
    
    tableHtml += `<tr>
      <td class="team-cell">${s.team}</td>
      <td class="num-cell">${s.legasaur || '-'}</td><td class="num-cell">${s.coffa || '-'}</td>
      <td class="num-cell">${s.europa || '-'}</td><td class="num-cell">${s.supercoffa || '-'}</td>
      <td class="num-cell"><b>${s.totale}</b></td>
    </tr>`;
  });
  tableHtml += '</tbody></table>';
  
  // Legend
  const legend = `<div style="display:flex;gap:1rem;margin:1rem 0;flex-wrap:wrap;font-size:.82rem">
    <span><span style="display:inline-block;width:12px;height:12px;background:var(--gold);border-radius:2px;vertical-align:middle"></span> Legasaur</span>
    <span><span style="display:inline-block;width:12px;height:12px;background:var(--accent);border-radius:2px;vertical-align:middle"></span> Coffa</span>
    <span><span style="display:inline-block;width:12px;height:12px;background:#42a5f5;border-radius:2px;vertical-align:middle"></span> +Europa</span>
    <span><span style="display:inline-block;width:12px;height:12px;background:#ab47bc;border-radius:2px;vertical-align:middle"></span> Supercoffa</span>
  </div>`;
  
  container.innerHTML = legend + `<div style="background:var(--bg2);border-radius:var(--radius);padding:1rem;margin-bottom:1.5rem">${barsHtml}</div>` + tableHtml;
}

// ---- ROSE ----
let currentRoseSeason = '2025/2026';
let currentRoseTeam = 'all';

function initRose() {
  const seasons = Object.keys(DATA.rose).reverse();
  document.getElementById('rose-seasons').innerHTML = seasons.map(s =>
    `<button class="season-btn${s === currentRoseSeason ? ' active' : ''}" data-season="${s}" onclick="selectRoseSeason('${s}')">${s}</button>`
  ).join('');
  renderRose();
}

function selectRoseSeason(s) {
  currentRoseSeason = s;
  currentRoseTeam = 'all';
  document.querySelectorAll('#rose-seasons .season-btn').forEach(b => b.classList.toggle('active', b.dataset.season === s));
  document.getElementById('rose-search').value = '';
  renderRose();
}

function renderRose() {
  const teams = DATA.rose[currentRoseSeason] || {};
  const teamNames = Object.keys(teams);
  
  // Team tabs
  document.getElementById('rose-teams').innerHTML = 
    `<button class="team-tab${currentRoseTeam === 'all' ? ' active' : ''}" onclick="selectRoseTeam('all')">Tutte</button>` +
    teamNames.map(t => `<button class="team-tab${currentRoseTeam === t ? ' active' : ''}" onclick="selectRoseTeam('${t.replace(/'/g, "\\'")  }')">${t}</button>`).join('');
  
  const search = (document.getElementById('rose-search').value || '').toLowerCase();
  const container = document.getElementById('rose-content');
  
  let html = '';
  teamNames.forEach(team => {
    if (currentRoseTeam !== 'all' && currentRoseTeam !== team) return;
    
    let players = teams[team] || [];
    if (search) players = players.filter(p => p.n.toLowerCase().includes(search));
    if (players.length === 0 && search) return;
    
    let rows = players.map(p => `<tr>
      <td><span class="role-badge role-${p.r}">${p.r}</span></td>
      <td class="player-name">${p.n}</td>
      <td style="color:var(--text2)">${p.s}</td>
      <td class="cost">${p.c || 0}</td>
    </tr>`).join('');
    
    html += `<div class="roster-card">
      <div class="roster-header">${team}</div>
      <table class="roster-table"><tbody>${rows}</tbody></table>
    </div>`;
  });
  
  container.innerHTML = html || '<p style="color:var(--text2)">Nessun risultato</p>';
}

function selectRoseTeam(t) {
  currentRoseTeam = t;
  document.querySelectorAll('#rose-teams .team-tab').forEach(b => {
    b.classList.toggle('active', 
      (t === 'all' && b.textContent === 'Tutte') || b.textContent === t
    );
  });
  renderRose();
}

function filterRose() { renderRose(); }

// ---- HOME ----
function initHome() {
  // Stats
  const allTeams = new Set();
  Object.values(DATA.classifiche).forEach(teams => teams.forEach(t => allTeams.add(t.team)));
  const seasons = Object.keys(DATA.classifiche);
  const totalTrophies = DATA.storico.reduce((s, t) => s + t.totale, 0);
  
  // Most titled
  const topTeam = DATA.storico[0];
  
  document.getElementById('stats-overview').innerHTML = `
    <div class="stat-card"><div class="stat-val">${seasons.length}</div><div class="stat-label">Stagioni</div></div>
    <div class="stat-card"><div class="stat-val">${allTeams.size}</div><div class="stat-label">Squadre partecipanti</div></div>
    <div class="stat-card"><div class="stat-val">${totalTrophies}</div><div class="stat-label">Trofei assegnati</div></div>
    <div class="stat-card"><div class="stat-val">${topTeam ? topTeam.team : '-'}</div><div class="stat-label">Squadra pi\u00f9 titolata (${topTeam ? topTeam.totale : 0})</div></div>
  `;
  
  // Latest classifica
  renderClassificaInto('home-classifica', '2025/2026');
  
  // Recent albo
  const recent = DATA.albo.slice(-3).reverse();
  document.getElementById('home-albo').innerHTML = `<div class="trophy-grid">${recent.map(a => `
    <div class="trophy-card">
      <div class="season">${a.stagione}</div>
      <div class="winner">&#127942; ${a.legasaur}</div>
      <div class="trophy-line"><span class="label">Coffa:</span><span class="val">${a.coffa && a.coffa !== '//' ? a.coffa : '-'}</span></div>
      <div class="trophy-line"><span class="label">+Europa:</span><span class="val">${a.europa && a.europa !== '//' ? a.europa : '-'}</span></div>
    </div>
  `).join('')}</div>`;
}

function renderClassificaInto(containerId, season) {
  const teams = DATA.classifiche[season] || [];
  const hasPt = teams.some(t => t.pt !== undefined);
  const hasV = teams.some(t => t.v !== undefined);
  const hasTotale = teams.some(t => t.totale !== undefined || t.pt_totali !== undefined);
  
  let cols = '<th>#</th><th>Squadra</th>';
  if (hasPt) cols += '<th class="num-cell">Pt</th>';
  if (hasV) cols += '<th class="num-cell">V</th><th class="num-cell">N</th><th class="num-cell">P</th>';
  if (teams.some(t => t.gf !== undefined)) cols += '<th class="num-cell">Gf</th><th class="num-cell">Gs</th>';
  
  let rows = teams.map(t => {
    const pc = t.pos <= 3 ? ' pos-' + t.pos : '';
    let r = `<td class="pos-cell${pc}">${t.pos}</td><td class="team-cell">${t.team}</td>`;
    if (hasPt) r += `<td class="num-cell"><b>${t.pt !== undefined ? Math.round(t.pt) : '-'}</b></td>`;
    if (hasV) {
      r += `<td class="num-cell">${t.v !== undefined ? Math.round(t.v) : '-'}</td>`;
      r += `<td class="num-cell">${t.n !== undefined ? Math.round(t.n) : '-'}</td>`;
      r += `<td class="num-cell">${t.p !== undefined ? Math.round(t.p) : '-'}</td>`;
    }
    if (teams.some(t => t.gf !== undefined)) {
      r += `<td class="num-cell">${t.gf !== undefined ? Math.round(t.gf) : '-'}</td>`;
      r += `<td class="num-cell">${t.gs !== undefined ? Math.round(t.gs) : '-'}</td>`;
    }
    return `<tr>${r}</tr>`;
  }).join('');
  
  document.getElementById(containerId).innerHTML = `<table><thead><tr>${cols}</tr></thead><tbody>${rows}</tbody></table>`;
}

// ---- INIT ----
initHome();
initClassifiche();
initAlbo();
initStorico();
initRose();
</script>
</body>
</html>
